
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Calculator | Hajra's Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="calculator">

        <div class="display">
            <div class="previous-value" id="previousValue"></div>
            <div class="current-value" id="currentValue">0</div>
        </div>

        <div class="buttons">

            <button class="btn utility" type="button" data-action="clear">AC</button>
            <button class="btn utility" type="button" data-action="sign">±</button>
            <button class="btn utility" type="button" data-action="percent">%</button>
            <button class="btn operator" type="button" data-action="operator" data-operator="/">÷</button>

            <button class="btn" type="button" data-number="7">7</button>
            <button class="btn" type="button" data-number="8">8</button>
            <button class="btn" type="button" data-number="9">9</button>
            <button class="btn operator" type="button" data-action="operator" data-operator="*">×</button>

            <button class="btn" type="button" data-number="4">4</button>
            <button class="btn" type="button" data-number="5">5</button>
            <button class="btn" type="button" data-number="6">6</button>
            <button class="btn operator" type="button" data-action="operator" data-operator="-">−</button>

            <button class="btn" type="button" data-number="1">1</button>
            <button class="btn" type="button" data-number="2">2</button>
            <button class="btn" type="button" data-number="3">3</button>
            <button class="btn operator" type="button" data-action="operator" data-operator="+">+</button>

            <button class="btn zero" type="button" data-number="0">0</button>
            <button class="btn" type="button" data-action="decimal">.</button>
            <button class="btn operator" type="button" data-action="equals">=</button>

        </div>

    </div>

</body>
</html>
